[package]
name = "clicky-backend"
version = "0.1.0"
edition = "2021"
description = "Backend pipeline server for clicky-desktop — handles transcription, LLM, TTS, and Computer Use APIs"

[[bin]]
name = "clicky-backend"
path = "src/main.rs"

[dependencies]
clicky-types = { path = "../clicky-types" }

tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"

reqwest = { version = "0.12", features = ["stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
regex = "1"

thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

dotenvy = "0.15"
