[workspace]
members = [
    ".",          # clicky-desktop (frontend)
    "backend",
    "clicky-types",
]
resolver = "2"

[package]
name = "clicky-desktop"
version = "0.1.0"
edition = "2021"
description = "Cross-platform AI companion with voice input, screen capture, and cursor overlay"
license = "MIT"

[dependencies]
clicky-types = { path = "clicky-types" }

tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
cpal = "0.15"
rodio = { version = "0.20", default-features = false, features = ["mp3"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "6"
futures-util = "0.3"
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
dotenvy = "0.15"
xcap = "0.9"
tray-icon = "0.19"
global-hotkey = "0.6"
winit        = { version = "0.30", features = ["rwh_06"] }
wgpu         = "22"
tiny-skia    = "0.11"
cosmic-text  = "0.12"
spin_sleep   = "1"
bytemuck     = { version = "1", features = ["derive"] }
pollster     = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12"
x11rb = { version = "0.13", features = ["xfixes"] }
gtk = "0.18"
wayland-client = "0.31"
wayland-protocols-wlr = "0.3"

[target.'cfg(not(target_os = "windows"))'.dependencies]
eframe = "0.31"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.52"

# ------------------------------------------------------------------
# In debug builds, optimize all dependencies but keep the main crate
# unoptimized for fast incremental recompilation.
#
# Without this, tiny-skia rasterizes a 1920x1080 overlay at ~54ms/frame
# (18fps). With opt-level=2, the same work takes ~1ms (144fps capable).
# ------------------------------------------------------------------
[profile.dev.package."*"]
opt-level = 2
